<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAPOLE ADMIN</title><style>
*{box-sizing:border-box}body{margin:0;background:#07080b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:28px 5%}.box{background:#101217;border:1px solid #262a32;border-radius:14px;padding:20px;margin:14px 0}.login{max-width:400px;margin:12vh auto;display:grid;gap:10px}input,select,button,textarea{padding:10px;border-radius:7px;border:1px solid #2a2f38;background:#11141a;color:#fff}button{cursor:pointer}.primary{background:#19d9ff;color:#000;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.stat{padding:15px;background:#101217;border:1px solid #292e37;border-radius:10px}.stat b{display:block;color:#19d9ff;font-size:24px;margin-top:7px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{padding:10px;border-bottom:1px solid #252a31;text-align:left;font-size:12px}th{color:#19d9ff}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}.tag{padding:5px 8px;background:#1b2028;border-radius:99px;font-size:10px}.payment{padding:12px;border-bottom:1px solid #252932}.ok{color:#64e88a}.err{color:#ff6575}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="app"></div><script>
let T=localStorage.getItem('wapole_admin_token'),app=document.getElementById('app'),orders=[];
function login(){app.innerHTML='<div class="wrap login box"><h1>WAPOLE ADMIN</h1><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="primary" onclick="doLogin()">Login</button><span id="e" class="err"></span></div>'}
async function doLogin(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}),d=await r.json();if(r.ok){T=d.token;localStorage.setItem('wapole_admin_token',T);dash()}else e.textContent=d.error}
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+T};let r=await fetch(u,o);if(r.status===401){localStorage.removeItem('wapole_admin_token');T=null;login();throw Error('Session expired')}return r}
async function dash(){app.innerHTML='<div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center"><div><small style="color:#19d9ff">WAPOLE STUDIOS</small><h1>Admin Dashboard</h1></div><button onclick="logout()">Logout</button></div><div class="grid"><div class="stat">ORDERS<b id="a">0</b></div><div class="stat">PENDING<b id="b">0</b></div><div class="stat">PAYMENT CHECK<b id="c">0</b></div><div class="stat">PROCESSING<b id="d">0</b></div><div class="stat">COMPLETED<b id="e2">0</b></div><div class="stat">VERIFIED TZS<b id="f">0</b></div></div><div class="layout"><div class="box"><h2>Orders</h2><input id="search" placeholder="Search order/customer/service" oninput="renderOrders()"><div class="table"><table><thead><tr><th>ORDER</th><th>CUSTOMER</th><th>SERVICE</th><th>STATUS</th><th>ACTIONS</th></tr></thead><tbody id="rows"></tbody></table></div></div><div><div class="box"><h2>Payment Verification</h2><div id="payments"></div></div><div class="box"><h2>Recent Notifications</h2><div id="notifs"></div></div></div></div></div>';await load()}
async function load(){let [s,o,p,n]=await Promise.all([api('/api/admin/summary'),api('/api/admin/orders'),api('/api/admin/payments'),api('/api/admin/notifications')]);let sd=await s.json();orders=await o.json();let ps=await p.json(),ns=await n.json();a.textContent=sd.total;b.textContent=sd.pending;c.textContent=sd.verify;d.textContent=sd.processing;e2.textContent=sd.completed;f.textContent='TZS '+Number(sd.revenue).toLocaleString();renderOrders();payments.innerHTML=ps.length?ps.slice(0,20).map(x=>'<div class="payment"><b>'+x.order_code+' — '+esc(x.customer_name)+'</b><br>TZS '+Number(x.amount).toLocaleString()+' · '+esc(x.method)+' · Ref '+esc(x.reference)+'<br>Status: <span class="tag">'+x.status+'</span><br>'+esc(x.note||'')+'<br><br><button class="primary" onclick="verify('+x.id+')">Verify</button> <button onclick="rejectPay('+x.id+')">Reject</button></div>').join(''):'<span style="color:#999">No payments.</span>';notifs.innerHTML=ns.slice(0,12).map(x=>'<div style="padding:8px 0;border-bottom:1px solid #242831"><b>'+esc(x.order_code)+'</b> '+esc(x.title)+'<br><small>'+esc(x.message)+'</small></div>').join('')}
function serviceLabel(v){try{let x=JSON.parse(v);return Array.isArray(x)?x.join(', '):v}catch(e){return v}}
function renderOrders(){let q=(search.value||'').toLowerCase();rows.innerHTML=orders.filter(x=>(x.order_code+' '+x.customer_name+' '+x.service+' '+x.status).toLowerCase().includes(q)).map(x=>'<tr><td><b>'+x.order_code+'</b><br><small>'+new Date(x.created_at).toLocaleString()+'</small></td><td>'+esc(x.customer_name)+'<br>'+esc(x.phone)+'</td><td>'+esc(serviceLabel(x.service))+'<br>TZS '+Number(x.price).toLocaleString()+'</td><td><span class="tag">'+x.status+'</span></td><td><select onchange="status('+x.id+',this.value)"><option>'+x.status+'</option><option>PENDING</option><option>PAYMENT VERIFICATION</option><option>PAYMENT VERIFIED</option><option>PROCESSING</option><option>REVISION REQUESTED</option><option>COMPLETED</option><option>DELIVERED</option><option>CLOSED</option></select><button onclick="detail('+x.id+')">Details</button> <button class="primary" onclick="deliver('+x.id+',&#039;'+esc(x.order_code)+'&#039;)">Send Work</button></td></tr>').join('')}
async function status(id,s){await api('/api/admin/orders/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});load()}
async function verify(id){await api('/api/admin/payments/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'VERIFIED',note:'Payment verified by Admin.'})});load()}
async function rejectPay(id){let n=prompt('Reason for rejection?')||'Payment could not be verified.';await api('/api/admin/payments/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'REJECTED',note:n})});load()}
async function detail(id){let r=await api('/api/admin/orders/'+id),d=await r.json();alert('ORDER '+d.order.order_code+'\\nCustomer: '+d.order.customer_name+'\\nService: '+serviceLabel(d.order.service)+'\\nStatus: '+d.order.status+'\\n\\nDetails:\\n'+d.order.details+'\\n\\nFiles: '+d.files.length+'\\nPayments: '+d.payments.length)}
async function deliver(id,code){let input=document.createElement('input');input.type='file';input.multiple=true;input.accept='.zip,.pdf,.png,.jpg,.jpeg,.webp,.mp3,.wav,.m4a,.mp4,.mov,.avi,.doc,.docx,.psd,.ai';input.onchange=async()=>{if(!input.files.length)return;let message=prompt('Message to customer (optional):','Your completed work is ready. You can download the files from your order dashboard.')??'';let fd=new FormData();[...input.files].forEach(f=>fd.append('files',f));fd.append('message',message);let r=await api('/api/admin/orders/'+id+'/deliver',{method:'POST',body:fd});let d=await r.json();if(!r.ok)return alert(d.error||'Delivery failed');alert('Work sent successfully to '+code+'\nFiles: '+d.files.length+'\nCustomer has been notified.');load()} ;input.click()}
function logout(){localStorage.removeItem('wapole_admin_token');T=null;login()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}if(T)dash();else login();
</script></body></html>
